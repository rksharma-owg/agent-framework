name: Fork Python Preflight
run-name: Pre-PR Python - ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA already pushed to this fork
        required: true
        type: string

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_CACHE_DIR: /tmp/.uv-cache
      TARGET_SHA: ${{ inputs.sha }}
    steps:
      - name: Validate immutable target
        shell: bash
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Provide a full lowercase 40-character commit SHA."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Verify and record tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          printf 'Tested commit: %s\n' "$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python and install the project
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}
          os: ${{ runner.os }}
          exclude-packages: ${{ matrix.python-version == '3.10' && 'agent-framework-github-copilot agent-framework-azure-cosmos-memory' || '' }}

      - name: Run unit tests
        if: matrix.python-version != '3.11' || matrix.os != 'ubuntu-latest'
        working-directory: python
        run: uv run poe test -A -m "not integration" --junitxml=pytest.xml

      - name: Run unit tests with coverage
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        working-directory: python
        run: uv run poe test -A -C -m "not integration" --junitxml=pytest.xml --cov-report=xml:python-coverage.xml

      - name: Check package coverage thresholds
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        working-directory: python
        run: uv run python ../.github/scripts/python_check_coverage.py python-coverage.xml 85

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python-version }}-${{ matrix.os }}-${{ inputs.sha }}
          path: |
            python/pytest.xml
            python/python-coverage.xml
          retention-days: 7
          if-no-files-found: warn

  ollama-integration:
    name: Ollama Integration / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
      TARGET_SHA: ${{ inputs.sha }}
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify tested commit
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          printf 'Tested commit: %s\n' "$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.13"
          os: Linux
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-1.5b-nomic-embed-text-v1
      - name: Start Ollama and pull models
        run: |
          pkill ollama || true
          sleep 2
          ollama serve > /tmp/ollama-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://localhost:11434/api/version
          for model in qwen2.5:1.5b nomic-embed-text; do
            pulled=false
            for attempt in 1 2 3; do
              if ollama pull "$model"; then pulled=true; break; fi
              sleep 15
            done
            test "$pulled" = true
          done
      - name: Run Ollama integration tests
        working-directory: python
        run: uv run pytest packages/ollama/tests -m integration --import-mode=importlib --junitxml=ollama-integration.xml -ra
      - name: Verify real numeric-zero unload behavior
        working-directory: python
        run: |
          uv run python - <<'PROBE'
          import asyncio
          from agent_framework_ollama import OllamaEmbeddingClient

          async def main():
              client = OllamaEmbeddingClient(model="nomic-embed-text")
              try:
                  for duration in (0, 0.0):
                      result = await client.get_embeddings(["zero duration probe"], options={"keep_alive": duration})
                      assert len(result) == 1 and len(result[0].vector) > 0
                      for _ in range(100):
                          response = await client.client.ps()
                          if not any((entry.model or "").split(":")[0] == "nomic-embed-text" for entry in response.models):
                              print(f"keep_alive={duration!r}: embedding returned and model unloaded")
                              break
                          await asyncio.sleep(0.1)
                      else:
                          raise AssertionError(f"model still loaded after keep_alive={duration!r}")
              finally:
                  await client.client._client.aclose()

          asyncio.run(main())
          PROBE
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ollama-integration-${{ inputs.sha }}
          path: |
            python/ollama-integration.xml
            /tmp/ollama-server.log
          retention-days: 7
